services:
  backend-blue:
    build: ./backend
    environment:
      PORT: 5000
      VERSION: blue
    ports:
      - "5000:5000"
    restart: unless-stopped
  backend-green:
    build: ./backend
    environment:
      PORT: 5000
      VERSION: green
    ports:
      - "5001:5000"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "5173:80"
    depends_on:
      - backend-blue
      - backend-green
