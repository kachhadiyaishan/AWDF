<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AWDF Practical 4 Task Manager REST API demo">
  <title>Task Manager | AWDF Practical 4</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">AWDF · PRACTICAL 04</p>
      <h1>Task Manager</h1>
      <p>Manage tasks through the Express REST API.</p>
      <span id="api-status" class="status">Checking API…</span>
    </header>
    <section class="panel">
      <h2>Create a task</h2>
      <form id="task-form">
        <label for="title">Task title</label>
        <input id="title" name="title" maxlength="120" placeholder="e.g. Complete practical record" required>
        <button type="submit">Add task</button>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>
    <section class="panel">
      <div class="section-heading"><div><h2>Your tasks</h2><p>Data resets when the API server restarts.</p></div><button id="refresh" class="secondary" type="button">Refresh</button></div>
      <div id="tasks" class="tasks" aria-live="polite"><p>Loading tasks…</p></div>
    </section>
    <footer>Built for Advanced Web Development Frameworks · Practical 4</footer>
  </main>
</body>
</html>
