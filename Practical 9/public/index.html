<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache Lab | AWDF Practical 9</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body><main class="shell"><header><p class="eyebrow">AWDF · PRACTICAL 09</p><h1>Cache Lab</h1><p>Observe cache hits, misses, and invalidation as you manage tasks.</p><span id="status" class="pill">Connecting…</span></header><section class="panel"><h2>Create task</h2><form id="form"><label for="title">Title</label><input id="title" name="title" required maxlength="120" placeholder="Name a task"><label for="priority">Priority</label><select id="priority" name="priority"><option>low</option><option selected>medium</option><option>high</option></select><button>Add task</button><p id="message" role="status"></p></form></section><section class="panel"><div class="head"><h2>Tasks</h2><button id="refresh" type="button" class="secondary">Reload</button></div><div id="tasks">Loading…</div></section><section class="panel"><div class="head"><h2>Cache metrics</h2><button id="metrics" type="button" class="secondary">Refresh metrics</button></div><pre id="cache">Loading metrics…</pre><p>Check the response's <code>X-Cache</code> header in your browser Network panel.</p></section></main></body></html>
