name: Deploy AWDF demo hub

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/deploy-demo-hub.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload demo hub
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy demo hub
        id: deployment
        uses: actions/deploy-pages@v5
