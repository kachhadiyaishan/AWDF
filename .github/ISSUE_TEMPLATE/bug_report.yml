name: Bug report
description: Report a reproducible issue in a practical or assignment.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: folder
    attributes:
      label: Practical or assignment folder
      description: For example, Practical 7 or ASSIGNMENT_3.
      placeholder: "Practical 7"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Install dependencies ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include relevant versions and sanitized error output. Never paste credentials or API keys.
    validations:
      required: false
