services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-data:/data/db"]
    networks: [app-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/awdf_tasks
    ports: ["5000:5000"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [app-network]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
    networks: [app-network]
networks:
  app-network:
    driver: bridge
volumes:
  mongo-data:
